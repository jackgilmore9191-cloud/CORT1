<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麒麟工作室 · 资源下载中心</title>
<style>
  /* ================= 变量 ================= */
  :root{
    --gold:#f7c95c;
    --gold-light:#ffe9a8;
    --gold-deep:#d99f2b;
    --violet:#9a7bff;
    --cyan:#4fd1ff;
    --bg:#05060c;
    --card-bg:rgba(10,12,20,.82);
    --txt:#eef1fa;
    --muted:#8d95ac;
  }

  @property --ang{
    syntax:'<angle>';
    initial-value:0deg;
    inherits:true;
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html{scroll-behavior:smooth;}

  body{
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",system-ui,sans-serif;
    color:var(--txt);
    background:var(--bg);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:46px 18px 34px;
    overflow-x:hidden;
    position:relative;
  }

  /* ================= 背景光晕 ================= */
  .bg-orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}

  .orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;will-change:transform;}

  .orb-1{width:560px;height:560px;top:-190px;left:-160px;
    background:radial-gradient(circle, rgba(247,201,92,.62), transparent 68%);
    animation:float1 19s ease-in-out infinite;}
  .orb-2{width:660px;height:660px;bottom:-260px;right:-200px;
    background:radial-gradient(circle, rgba(140,90,255,.5), transparent 68%);
    animation:float2 23s ease-in-out infinite;}
  .orb-3{width:440px;height:440px;top:42%;left:56%;
    background:radial-gradient(circle, rgba(255,118,58,.3), transparent 70%);
    animation:float3 17s ease-in-out infinite;}
  .orb-4{width:380px;height:380px;top:8%;right:6%;
    background:radial-gradient(circle, rgba(60,200,255,.24), transparent 70%);
    animation:float1 21s ease-in-out infinite reverse;}

  @keyframes float1{
    0%,100%{transform:translate3d(0,0,0) scale(1);}
    33%{transform:translate3d(70px,60px,0) scale(1.12);}
    66%{transform:translate3d(-40px,90px,0) scale(.94);}
  }
  @keyframes float2{
    0%,100%{transform:translate3d(0,0,0) scale(1);}
    40%{transform:translate3d(-90px,-70px,0) scale(1.16);}
    70%{transform:translate3d(50px,-40px,0) scale(.92);}
  }
  @keyframes float3{
    0%,100%{transform:translate3d(0,0,0) scale(1);}
    50%{transform:translate3d(-110px,-60px,0) scale(1.2);}
  }

  /* 细网格 */
  .bg-grid{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(ellipse 75% 65% at 50% 35%, #000 0%, transparent 100%);
    -webkit-mask-image:radial-gradient(ellipse 75% 65% at 50% 35%, #000 0%, transparent 100%);
  }

  #fx{position:fixed;inset:0;z-index:1;pointer-events:none;}

  /* 鼠标光晕 */
  .cursor-glow{
    position:fixed;z-index:3;
    width:420px;height:420px;margin:-210px 0 0 -210px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(247,201,92,.16), transparent 62%);
    pointer-events:none;mix-blend-mode:screen;opacity:0;
    transition:opacity .5s;will-change:transform;
  }
  .cursor-glow.on{opacity:1;}

  /* ================= 卡片外框 ================= */
  .card-wrap{
    position:relative;z-index:10;
    width:100%;max-width:580px;
    border-radius:32px;padding:1.6px;
    background:conic-gradient(from var(--ang),
        rgba(247,201,92,0)   0deg,
        rgba(247,201,92,.95) 42deg,
        rgba(255,240,190,1)  72deg,
        rgba(247,201,92,0)   130deg,
        rgba(247,201,92,0)   205deg,
        rgba(154,123,255,.9) 258deg,
        rgba(247,201,92,0)   320deg);
    animation:spinAng 7s linear infinite;
    box-shadow:0 0 70px -14px rgba(247,201,92,.4), 0 46px 110px -46px #000;
  }

  .card-wrap::before{
    content:"";position:absolute;inset:-3px;border-radius:36px;
    background:conic-gradient(from var(--ang),
        rgba(247,201,92,0)   0deg,
        rgba(247,201,92,.85) 42deg,
        rgba(255,240,190,.9) 72deg,
        rgba(247,201,92,0)   130deg,
        rgba(247,201,92,0)   205deg,
        rgba(154,123,255,.8) 258deg,
        rgba(247,201,92,0)   320deg);
    filter:blur(24px);opacity:.55;z-index:-1;
  }

  @keyframes spinAng{to{--ang:360deg;}}

  /* ================= 主卡片 ================= */
  .card{
    position:relative;
    background:var(--card-bg);
    backdrop-filter:blur(26px) saturate(150%);
    -webkit-backdrop-filter:blur(26px) saturate(150%);
    border-radius:30.4px;
    padding:42px 26px 32px;
    overflow:hidden;
  }

  .card::after{
    content:"";position:absolute;top:-60%;left:-80%;
    width:60%;height:220%;
    background:linear-gradient(100deg,
      transparent 0%,
      rgba(255,255,255,.07) 45%,
      rgba(247,201,92,.14) 50%,
      rgba(255,255,255,.07) 55%,
      transparent 100%);
    transform:rotate(18deg);
    animation:sweep 6.5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes sweep{0%{left:-80%;}55%,100%{left:130%;}}

  /* ================= Logo ================= */
  .logo{
    position:relative;width:96px;height:96px;
    margin:0 auto 20px;display:grid;place-items:center;
    filter:drop-shadow(0 10px 30px rgba(247,201,92,.45));
    animation:logoPulse 4.5s ease-in-out infinite;
  }
  @keyframes logoPulse{
    0%,100%{filter:drop-shadow(0 10px 30px rgba(247,201,92,.35));}
    50%{filter:drop-shadow(0 10px 42px rgba(247,201,92,.75));}
  }
  .logo svg{position:absolute;inset:0;width:100%;height:100%;}
  .logo .hex-out{transform-origin:50% 50%;animation:hexSpin 22s linear infinite;}
  @keyframes hexSpin{to{transform:rotate(360deg);}}

  .logo-char{
    position:relative;font-size:38px;font-weight:900;
    background:linear-gradient(145deg,#fff9e4 0%,var(--gold) 45%,var(--gold-deep) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    transform:translateY(-1px);
    text-shadow:0 0 34px rgba(247,201,92,.5);
  }

  /* ================= 标题 ================= */
  .title{
    text-align:center;font-size:30px;font-weight:900;letter-spacing:5px;
    background:linear-gradient(100deg,#fff8e2 0%,var(--gold) 42%,var(--gold-deep) 88%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 60px rgba(247,201,92,.28);
  }

  .subtitle{
    text-align:center;font-size:13px;color:var(--muted);
    margin-top:12px;letter-spacing:2px;
  }
  .subtitle b{color:var(--gold);font-weight:600;opacity:.9;}

  /* ================= 按钮 ================= */
  .actions{display:flex;flex-direction:column;gap:14px;margin-top:34px;}

  .btn{
    position:relative;display:flex;align-items:center;justify-content:center;
    gap:10px;width:100%;padding:17px 22px;border-radius:16px;
    font-size:16px;font-weight:800;letter-spacing:1px;
    text-decoration:none;cursor:pointer;border:none;overflow:hidden;
    font-family:inherit;
    transition:transform .28s cubic-bezier(.22,1,.36,1), box-shadow .28s, background .28s, border-color .28s;
  }
  .btn svg{width:20px;height:20px;flex-shrink:0;position:relative;z-index:2;}
  .btn span{position:relative;z-index:2;}

  /* 主按钮 */
  .btn-primary{
    background:linear-gradient(135deg,#fff3cd 0%,var(--gold) 42%,var(--gold-deep) 100%);
    color:#241a05;
    box-shadow:0 16px 38px -14px rgba(247,201,92,.9),
               inset 0 1px 0 rgba(255,255,255,.65),
               inset 0 -2px 6px rgba(150,100,0,.2);
  }
  .btn-primary::before{
    content:"";position:absolute;top:0;left:-100%;
    width:60%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);
    transform:skewX(-22deg);
    animation:btnShine 3.2s ease-in-out infinite;
  }
  @keyframes btnShine{0%{left:-100%;}60%,100%{left:160%;}}

  .btn-primary:hover{
    transform:translateY(-3px);
    box-shadow:0 24px 48px -14px rgba(247,201,92,1), inset 0 1px 0 rgba(255,255,255,.7);
  }
  .btn-primary:active{transform:translateY(-1px) scale(.985);}

  /* 次按钮 */
  .btn-ghost{
    background:rgba(247,201,92,.06);
    border:1px solid rgba(247,201,92,.42);
    color:var(--gold);
    box-shadow:inset 0 0 24px rgba(247,201,92,.06);
  }
  .btn-ghost:hover{
    background:rgba(247,201,92,.14);
    border-color:rgba(247,201,92,.8);
    color:var(--gold-light);
    transform:translateY(-3px);
    box-shadow:0 16px 34px -16px rgba(247,201,92,.85), inset 0 0 30px rgba(247,201,92,.14);
  }
  .btn-ghost:active{transform:translateY(-1px) scale(.985);}

  /* ================= 分隔线 ================= */
  .divider{
    display:flex;align-items:center;gap:14px;
    margin:38px 0 22px;color:var(--muted);
    font-size:12.5px;letter-spacing:3px;font-weight:600;
  }
  .divider::before,.divider::after{
    content:"";flex:1;height:1px;
    background:linear-gradient(90deg,transparent,rgba(247,201,92,.45),transparent);
  }
  .divider i{
    font-style:normal;width:5px;height:5px;border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 12px 3px rgba(247,201,92,.7);
    animation:dotPulse 2s ease-in-out infinite;
  }
  @keyframes dotPulse{
    0%,100%{opacity:.5;transform:scale(.85);}
    50%{opacity:1;transform:scale(1.25);}
  }

  /* ================= 教程图片 ================= */
  .tutorials{display:flex;flex-direction:column;gap:16px;}

  .tut-item{
    position:relative;border-radius:18px;overflow:hidden;
    border:1px solid rgba(247,201,92,.18);
    background:#0d1018;cursor:zoom-in;
    transition:border-color .3s, transform .3s, box-shadow .3s;
    box-shadow:0 14px 34px -20px rgba(0,0,0,.95);
  }
  .tut-item::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.55));
    pointer-events:none;z-index:1;
  }
  .tut-item::after{
    content:"";position:absolute;inset:0;border-radius:18px;
    box-shadow:inset 0 0 0 1px rgba(247,201,92,0);
    transition:box-shadow .3s;pointer-events:none;z-index:2;
  }
  .tut-item:hover{
    border-color:rgba(247,201,92,.65);
    transform:translateY(-4px);
    box-shadow:0 26px 50px -22px rgba(247,201,92,.4), 0 14px 40px -20px #000;
  }
  .tut-item:hover::after{box-shadow:inset 0 0 30px rgba(247,201,92,.22);}

  .tut-item img{
    display:block;width:100%;height:auto;
    transition:transform .5s cubic-bezier(.22,1,.36,1);
  }
  .tut-item:hover img{transform:scale(1.035);}

  .tut-badge{
    position:absolute;top:12px;left:12px;z-index:3;
    padding:5px 13px;font-size:11px;font-weight:800;letter-spacing:1px;
    color:#241a05;
    background:linear-gradient(135deg,var(--gold-light),var(--gold-deep));
    border-radius:20px;
    box-shadow:0 4px 16px rgba(0,0,0,.5), 0 0 20px rgba(247,201,92,.5);
  }

  .tip{
    text-align:center;font-size:12px;color:var(--muted);
    margin-top:16px;letter-spacing:1px;
  }

  /* ================= 页脚 ================= */
  .footer{
    position:relative;z-index:10;margin-top:30px;
    font-size:12px;color:#565e73;letter-spacing:1.5px;text-align:center;
  }

  /* ================= 图片放大层 ================= */
  .lightbox{
    position:fixed;inset:0;z-index:999;
    display:flex;align-items:center;justify-content:center;padding:20px;
    background:rgba(3,4,9,.94);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    opacity:0;visibility:hidden;
    transition:opacity .32s, visibility .32s;
    cursor:zoom-out;
  }
  .lightbox.show{opacity:1;visibility:visible;}
  .lightbox img{
    max-width:100%;max-height:90vh;border-radius:16px;
    border:1px solid rgba(247,201,92,.35);
    box-shadow:0 0 60px rgba(247,201,92,.25), 0 34px 90px rgba(0,0,0,.95);
    transform:scale(.93);
    transition:transform .35s cubic-bezier(.22,1,.36,1);
  }
  .lightbox.show img{transform:scale(1);}

  /* ============================================================
     下载选择弹窗
     ============================================================ */
  .dl-modal{
    position:fixed;inset:0;z-index:1000;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    background:rgba(3,4,9,.86);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    opacity:0;visibility:hidden;
    transition:opacity .34s, visibility .34s;
  }
  .dl-modal.show{opacity:1;visibility:visible;}

  .dl-panel{
    position:relative;
    width:100%;max-width:440px;
    border-radius:26px;
    padding:1.6px;
    background:conic-gradient(from var(--ang),
        rgba(247,201,92,0)   0deg,
        rgba(247,201,92,.95) 42deg,
        rgba(255,240,190,1)  72deg,
        rgba(247,201,92,0)   130deg,
        rgba(247,201,92,0)   205deg,
        rgba(154,123,255,.9) 258deg,
        rgba(247,201,92,0)   320deg);
    animation:spinAng 6s linear infinite;
    box-shadow:0 0 60px -10px rgba(247,201,92,.45), 0 40px 90px -30px #000;
    transform:translateY(24px) scale(.94);
    transition:transform .4s cubic-bezier(.22,1,.36,1);
  }
  .dl-modal.show .dl-panel{transform:translateY(0) scale(1);}

  .dl-inner{
    background:linear-gradient(165deg, rgba(16,19,30,.98), rgba(9,11,19,.99));
    border-radius:24.4px;
    padding:30px 22px 24px;
    position:relative;
    overflow:hidden;
  }
  .dl-inner::before{
    content:"";position:absolute;
    top:-70px;left:50%;transform:translateX(-50%);
    width:280px;height:180px;
    background:radial-gradient(ellipse, rgba(247,201,92,.28), transparent 70%);
    pointer-events:none;
  }

  /* 关闭按钮 */
  .dl-close{
    position:absolute;top:14px;right:14px;
    width:34px;height:34px;border-radius:50%;
    display:grid;place-items:center;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    color:var(--muted);
    cursor:pointer;font-size:16px;line-height:1;
    transition:background .25s, color .25s, transform .25s;
    z-index:5;
  }
  .dl-close:hover{
    background:rgba(247,201,92,.16);
    color:var(--gold);
    transform:rotate(90deg);
  }

  .dl-head{text-align:center;margin-bottom:22px;position:relative;z-index:2;}

  .dl-head-icon{
    width:52px;height:52px;margin:0 auto 12px;
    display:grid;place-items:center;
    border-radius:16px;
    background:linear-gradient(135deg, rgba(247,201,92,.18), rgba(154,123,255,.14));
    border:1px solid rgba(247,201,92,.3);
    box-shadow:0 0 26px rgba(247,201,92,.22);
  }
  .dl-head-icon svg{width:24px;height:24px;stroke:var(--gold);}

  .dl-head h2{
    font-size:19px;font-weight:800;letter-spacing:2px;
    background:linear-gradient(100deg,#fff8e2,var(--gold) 50%,var(--gold-deep));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .dl-head p{
    font-size:12px;color:var(--muted);margin-top:7px;letter-spacing:1px;
  }

  /* 下载选项 */
  .dl-list{display:flex;flex-direction:column;gap:11px;position:relative;z-index:2;}

  .dl-opt{
    position:relative;
    display:flex;align-items:center;gap:14px;
    padding:15px 16px;
    border-radius:16px;
    text-decoration:none;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.08);
    overflow:hidden;
    transition:transform .28s cubic-bezier(.22,1,.36,1),
               border-color .28s, background .28s, box-shadow .28s;
  }

  .dl-opt::before{
    content:"";position:absolute;top:0;left:-110%;
    width:55%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);
    transform:skewX(-20deg);
    transition:left .6s cubic-bezier(.22,1,.36,1);
  }
  .dl-opt:hover::before{left:150%;}

  .dl-opt:hover{
    transform:translateY(-3px);
    background:rgba(247,201,92,.09);
    border-color:rgba(247,201,92,.55);
    box-shadow:0 16px 34px -18px rgba(247,201,92,.9);
  }
  .dl-opt:active{transform:translateY(-1px) scale(.99);}

  /* 徽标 */
  .dl-badge{
    flex-shrink:0;
    width:46px;height:46px;border-radius:13px;
    display:grid;place-items:center;
    font-size:12px;font-weight:900;letter-spacing:.5px;
    color:#0d0f18;
    position:relative;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4);
  }

  .dl-badge.global{
    background:linear-gradient(140deg,#ffe9a8,#f7c95c 55%,#d99f2b);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 0 20px rgba(247,201,92,.55);
  }
  .dl-badge.tw{
    background:linear-gradient(140deg,#b9f0ff,#4fd1ff 55%,#1e9dd6);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 0 20px rgba(79,209,255,.5);
  }
  .dl-badge.vn{
    background:linear-gradient(140deg,#d8ffe0,#5ee888 55%,#1fae52);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 0 20px rgba(94,232,136,.5);
  }

  .dl-info{flex:1;min-width:0;}

  .dl-name{
    font-size:15px;font-weight:800;letter-spacing:.8px;color:#fff;
    display:flex;align-items:center;gap:7px;
  }
  .dl-name em{
    font-style:normal;
    font-size:9.5px;font-weight:700;letter-spacing:.8px;
    padding:2px 7px;border-radius:20px;
    background:rgba(247,201,92,.14);
    border:1px solid rgba(247,201,92,.3);
    color:var(--gold);
  }

  .dl-desc{
    font-size:11.5px;color:var(--muted);
    margin-top:5px;letter-spacing:.4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  .dl-arrow{
    flex-shrink:0;
    width:32px;height:32px;border-radius:50%;
    display:grid;place-items:center;
    background:rgba(247,201,92,.1);
    border:1px solid rgba(247,201,92,.25);
    transition:background .28s, transform .28s, border-color .28s;
  }
  .dl-arrow svg{
    width:15px;height:15px;
    stroke:var(--gold);stroke-width:2.4;
    fill:none;stroke-linecap:round;stroke-linejoin:round;
  }
  .dl-opt:hover .dl-arrow{
    background:var(--gold);
    border-color:var(--gold);
    transform:translateX(3px);
  }
  .dl-opt:hover .dl-arrow svg{stroke:#241a05;}

  .dl-foot{
    text-align:center;font-size:11px;color:#5c6479;
    margin-top:18px;letter-spacing:1px;position:relative;z-index:2;
  }

  /* ================= 响应式 ================= */
  @media (min-width:560px){
    .card{padding:50px 40px 38px;}
    .title{font-size:33px;}
    .actions{flex-direction:row;}
    .btn{flex:1;}
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
    }
  }

  @media (max-width:560px){
    .orb{filter:blur(60px);opacity:.45;}
    .cursor-glow{display:none;}
    .dl-panel{max-width:100%;}
    .dl-inner{padding:26px 18px 22px;}
  }
</style>
</head>
<body>

  <!-- ===== 背景 ===== -->
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
  </div>
  <div class="bg-grid" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

  <!-- ================= 主卡片 ================= -->
  <div class="card-wrap">
    <main class="card">

      <!-- Logo -->
      <div class="logo">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fff3cd"/>
              <stop offset="55%" stop-color="#f7c95c"/>
              <stop offset="100%" stop-color="#d99f2b"/>
            </linearGradient>
          </defs>
          <polygon class="hex-out"
                   points="50,3 93,26.5 93,73.5 50,97 7,73.5 7,26.5"
                   fill="rgba(247,201,92,0.05)"
                   stroke="url(#goldGrad)" stroke-width="2.6"
                   stroke-linejoin="round"/>

/* ============================================================
   1. 粒子星云背景
   ============================================================ */
(function () {
  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var W = 0, H = 0, dpr = 1;
  var parts = [];
  var mouse = { x: -99999, y: -99999 };
  var raf = null;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width = Math.floor(window.innerWidth * dpr);
    H = canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    build();
  }

  function build() {
    var count = Math.round(Math.min(130, Math.max(45,
      (window.innerWidth * window.innerHeight) / 16000)));
    parts = [];
    for (var i = 0; i < count; i++) {
      parts.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: (Math.random() * 1.7 + 0.6) * dpr,
        vx: (Math.random() - 0.5) * 0.22 * dpr,
        vy: (Math.random() - 0.5) * 0.22 * dpr,
        a: Math.random() * 0.55 + 0.2,
        p: Math.random() * Math.PI * 2,
        gold: Math.random() < 0.78
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    var linkDist = 118 * dpr;
    var linkSq = linkDist * linkDist;
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      for (var j = i + 1; j < parts.length; j++) {
        var q = parts[j];
        var dx = p.x - q.x, dy = p.y - q.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < linkSq) {
          var o = (1 - Math.sqrt(d2) / linkDist) * 0.15;
          ctx.strokeStyle = 'rgba(247,201,92,' + o.toFixed(3) + ')';
          ctx.lineWidth = dpr * 0.6;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.stroke();
        }
      }
    }

    for (var k = 0; k < parts.length; k++) {
      var pt = parts[k];

      var mdx = pt.x - mouse.x, mdy = pt.y - mouse.y;
      var md = Math.sqrt(mdx * mdx + mdy * mdy);
      var repel = 150 * dpr;
      if (md < repel && md > 0.01) {
        var f = (1 - md / repel) * 1.1;
        pt.x += (mdx / md) * f * dpr * 1.8;
        pt.y += (mdy / md) * f * dpr * 1.8;
      }

      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.p += 0.02;

      if (pt.x < -30) pt.x = W + 30;
      if (pt.x > W + 30) pt.x = -30;
      if (pt.y < -30) pt.y = H + 30;
      if (pt.y > H + 30) pt.y = -30;

      var tw = pt.a * (0.62 + 0.38 * Math.sin(pt.p));
      var col = pt.gold ? '255,224,150' : '175,145,255';

      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r * 4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + col + ',' + (tw * 0.1).toFixed(3) + ')';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + col + ',' + tw.toFixed(3) + ')';
      ctx.fill();
    }

    raf = requestAnimationFrame(draw);
  }

  window.addEventListener('resize', function () {
    clearTimeout(window.__rzT);
    window.__rzT = setTimeout(resize, 180);
  });

  window.addEventListener('mousemove', function (e) {
    mouse.x = e.clientX * dpr;
    mouse.y = e.clientY * dpr;
  }, { passive: true });

  window.addEventListener('mouseleave', function () {
    mouse.x = -99999;
    mouse.y = -99999;
  });

  resize();
  if (!reduce) {
    draw();
  } else {
    draw();
    cancelAnimationFrame(raf);
  }
})();

/* ============================================================
   2. 鼠标光晕跟随
   ============================================================ */
(function () {
  var glow = document.getElementById('cursorGlow');
  if (!glow) return;
  if (window.matchMedia('(max-width: 560px)').matches) return;

  var tx = window.innerWidth / 2, ty = window.innerHeight / 2;
  var cx = tx, cy = ty;

  window.addEventListener('mousemove', function (e) {
    tx = e.clientX;
    ty = e.clientY;
    glow.classList.add('on');
  }, { passive: true });

  window.addEventListener('mouseleave', function () {
    glow.classList.remove('on');
  });

  (function loop() {
    cx += (tx - cx) * 0.11;
    cy += (ty - cy) * 0.11;
    glow.style.transform = 'translate3d(' + cx + 'px,' + cy + 'px,0)';
    requestAnimationFrame(loop);
  })();
})();

  function close() {

    document.body.style.overflow = '';
  }

  openBtn.addEventListener('click', open);
  closeBtn.addEventListener('click', close);

  /* 点击遮罩关闭 */
  modal.addEventListener('click', function (e) {
    if (e.target === modal) close();
  });

  /* Esc 关闭 */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') close();
  });
})();

})();
