<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>米麒麟科技</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --cyan:#22d3ee;
    --cyan-dim:rgba(34,211,238,.28);
    --purple:#a855f7;
    --bg:#04060f;
    --text:#e2e8f0;
    --muted:#7d8ba5;
    --ok:#34d399;
    --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Consolas,monospace;
  }
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    overflow-x:hidden;-webkit-font-smoothing:antialiased;
  }
  /* ===== 背景层 ===== */
  #bg{position:fixed;inset:0;z-index:0;display:block}
  .grid-overlay{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background-image:
      linear-gradient(rgba(34,211,238,.055) 1px,transparent 1px),
      linear-gradient(90deg,rgba(34,211,238,.055) 1px,transparent 1px);
    background-size:58px 58px;
    -webkit-mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 0%,transparent 78%);
    mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 0%,transparent 78%);
  }
  .glow-orb{position:fixed;border-radius:50%;filter:blur(120px);z-index:0;pointer-events:none;opacity:.5}
  .orb-1{width:520px;height:520px;background:rgba(34,211,238,.20);top:-180px;left:-120px}
  .orb-2{width:480px;height:480px;background:rgba(168,85,247,.18);top:20%;right:-160px}
  .scanlines{
    position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.35;
    background:repeating-linear-gradient(180deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);
    mix-blend-mode:overlay;
  }
  /* ===== 头部 ===== */
  header{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px clamp(16px,4vw,48px);
    background:rgba(4,6,15,.62);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(34,211,238,.12);
  }
  .logo{display:flex;align-items:center;gap:12px}
  .logo-mark{width:40px;height:40px;flex:none;filter:drop-shadow(0 0 10px rgba(34,211,238,.55))}
  .logo-mark .ring{animation:spin 12s linear infinite;transform-origin:24px 24px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .logo-text{font-size:19px;font-weight:800;letter-spacing:3px;line-height:1.1}
  .logo-text b{background:linear-gradient(90deg,#22d3ee,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo-sub{font-size:9px;letter-spacing:3.5px;color:var(--muted);font-family:var(--mono)}
  .header-right{display:flex;align-items:center;gap:14px}
  .status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-family:var(--mono);letter-spacing:1px}
  .status i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
  .btn-ghost{
    padding:9px 18px;border-radius:9px;cursor:pointer;font-size:13px;letter-spacing:1px;
    border:1px solid var(--cyan-dim);background:rgba(34,211,238,.07);color:#a5f3fc;
    transition:.25s;font-family:inherit;
  }
  .btn-ghost:hover{background:rgba(34,211,238,.18);box-shadow:0 0 20px rgba(34,211,238,.3)}
  @media(max-width:600px){.status{display:none}.logo-text{font-size:16px}}
  /* ===== 主体 ===== */
  main{position:relative;z-index:5;padding:0 clamp(16px,4vw,48px) 80px;max-width:1240px;margin:0 auto}
  .hero{padding:clamp(48px,9vw,96px) 0 44px;text-align:center}
  .tag{
    display:inline-flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:11px;letter-spacing:2.5px;color:#67e8f9;
    padding:7px 16px;border-radius:99px;
    border:1px solid rgba(34,211,238,.28);background:rgba(34,211,238,.06);
    box-shadow:inset 0 0 20px rgba(34,211,238,.08);animation:fadeUp .7s both;
  }
  .hero h1{margin:22px 0 16px;font-size:clamp(30px,6.4vw,60px);line-height:1.14;font-weight:900;letter-spacing:2px;animation:fadeUp .7s .08s both}
  .grad{background:linear-gradient(100deg,#22d3ee 0%,#818cf8 45%,#e879f9 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(34,211,238,.35))}
  .lead{color:var(--muted);font-size:clamp(13px,2.4vw,16px);letter-spacing:1.5px;animation:fadeUp .7s .16s both}
  .meta-row{display:flex;justify-content:center;gap:clamp(20px,5vw,64px);margin-top:38px;flex-wrap:wrap;animation:fadeUp .7s .24s both}
  .meta{text-align:center}
  .meta b{display:block;font-family:var(--mono);font-size:26px;color:#67e8f9;letter-spacing:1px;text-shadow:0 0 18px rgba(34,211,238,.5)}
  .meta span{font-size:11px;color:var(--muted);letter-spacing:2px}
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  /* ===== 资源卡片 ===== */
  .section-title{display:flex;align-items:center;gap:14px;margin:24px 0 22px;font-family:var(--mono);font-size:12px;letter-spacing:3px;color:var(--muted)}
  .section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(34,211,238,.35),transparent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .card{
    position:relative;padding:22px;border-radius:16px;
    background:linear-gradient(180deg,rgba(13,20,38,.82),rgba(7,11,22,.86));
    border:1px solid rgba(34,211,238,.14);backdrop-filter:blur(6px);
    transition:.3s cubic-bezier(.2,.9,.3,1);
    animation:rise .65s cubic-bezier(.2,.9,.3,1) both;overflow:hidden;
  }
  @keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  .card::before,.card::after{content:'';position:absolute;width:14px;height:14px;border:1px solid rgba(34,211,238,.55);transition:.3s}
  .card::before{top:6px;left:6px;border-right:0;border-bottom:0;border-radius:4px 0 0 0}
  .card::after{bottom:6px;right:6px;border-left:0;border-top:0;border-radius:0 0 4px 0}
  .card:hover{transform:translateY(-5px);border-color:rgba(34,211,238,.42);box-shadow:0 18px 44px -18px rgba(34,211,238,.45),0 0 0 1px rgba(34,211,238,.08)}
  .card:hover::before,.card:hover::after{width:22px;height:22px;border-color:var(--cyan)}
  .card-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
  .icon{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);transition:.3s}
  .card:hover .icon{background:rgba(34,211,238,.09);box-shadow:0 0 22px rgba(34,211,238,.22)}
  .icon svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .card h3{font-size:15.5px;font-weight:700;letter-spacing:.5px;margin-bottom:5px;color:#f1f5f9}
  .ver{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:1px}
  .desc{font-size:12.5px;line-height:1.75;color:#8fa0b8;margin-bottom:14px;min-height:44px}
  .tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
  .tags span{font-size:10.5px;font-family:var(--mono);letter-spacing:1px;color:#7dd3fc;padding:3px 9px;border-radius:5px;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.16)}
  /* 下载按钮 */
  .dl-btn{
    width:100%;padding:12px;border-radius:10px;cursor:pointer;position:relative;overflow:hidden;
    font-family:inherit;font-size:13.5px;font-weight:600;letter-spacing:2.5px;
    color:#a5f3fc;border:1px solid var(--cyan-dim);
    background:linear-gradient(135deg,rgba(34,211,238,.12),rgba(168,85,247,.12));
    transition:.28s;
  }
  .dl-btn:hover{color:#fff;border-color:rgba(34,211,238,.6);background:linear-gradient(135deg,rgba(34,211,238,.3),rgba(168,85,247,.3));box-shadow:0 0 26px rgba(34,211,238,.38)}
  .dl-btn::after{content:'';position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);transition:left .6s}
  .dl-btn:hover::after{left:130%}
  .dl-btn:disabled{cursor:default;color:#6ee7b7;border-color:rgba(52,211,153,.45);background:linear-gradient(135deg,rgba(52,211,153,.16),rgba(34,211,238,.16))}
  .dl-btn:disabled::after{display:none}
  /* Toast */
  .toast{
    position:fixed;left:50%;bottom:36px;z-index:200;
    transform:translate(-50%,24px);opacity:0;pointer-events:none;
    padding:13px 26px;border-radius:11px;font-size:13px;letter-spacing:1px;
    background:rgba(8,14,28,.96);border:1px solid rgba(34,211,238,.35);
    color:#a5f3fc;box-shadow:0 0 34px rgba(34,211,238,.28);
    transition:.35s cubic-bezier(.2,.9,.3,1.2);white-space:nowrap;max-width:90vw;
    overflow:hidden;text-overflow:ellipsis;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  footer{
    position:relative;z-index:5;text-align:center;padding:26px 20px 40px;
    font-size:11px;color:#3f4d63;letter-spacing:1.5px;font-family:var(--mono);
    border-top:1px solid rgba(255,255,255,.04);
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="glow-orb orb-1"></div>
<div class="glow-orb orb-2"></div>
<div class="grid-overlay"></div>
<div class="scanlines"></div>

<header>
  <div class="logo">
    <svg class="logo-mark" viewBox="0 0 48 48">
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#22d3ee"/>

        </linearGradient>
      </defs>
      <path d="M24 3 43 14v20L24 45 5 34V14z" fill="none" stroke="url(#lg)" stroke-width="1.8"/>
      <path class="ring" d="M24 10 37 17.5v13L24 38 11 30.5v-13z" fill="none" stroke="url(#lg)" stroke-width="1" opacity=".55"/>
      <circle cx="24" cy="24" r="3.2" fill="url(#lg)"/>
      <circle cx="24" cy="24" r="6.5" fill="none" stroke="#22d3ee" stroke-width=".8" opacity=".45"/>
    </svg>
    <div>
      <div class="logo-text">米麒麟<b>科技</b></div>
      <div class="logo-sub">MIQILIN TECH</div>
    </div>
  </div>
  <div class="header-right">
    <span class="status"><i></i>NODE ONLINE</span>
    <button class="btn-ghost" id="jumpBtn">查看资源</button>
  </div>
</header>

<main>
  <section class="hero">
    <div class="tag">▸ SECURE DOWNLOAD NODE // AES-256 加密传输</div>
    <h1>米麒麟科技<br><span class="grad">资源下载中心</span></h1>
    <p class="lead">免费开放 · 极速下载 · 永久有效</p>
    <div class="meta-row">
      <div class="meta"><b id="statFiles">6</b><span>稳定</span></div>
      <div class="meta"><b>99.9%</b><span>安全</span></div>
      <div class="meta"><b>12ms</b><span>可靠</span></div>
      <div class="meta"><b>24/7</b><span>10年老店</span></div>
    </div>
  </section>

  <div class="section-title">// 可用资源列表</div>
  <section class="grid" id="grid"></section>
</main>

<footer>© 2026 米麒麟科技 · MIQILIN TECH · ALL RIGHTS RESERVED</footer>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   1. 背景粒子网络
   ========================================================= */
(function(){
  const cvs = document.getElementById('bg');
  const ctx = cvs.getContext('2d');
  let W = 0, H = 0, DPR = 1, ps = [];

  function init(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cvs.width  = Math.floor(innerWidth  * DPR);
    H = cvs.height = Math.floor(innerHeight * DPR);
    cvs.style.width  = innerWidth  + 'px';
    cvs.style.height = innerHeight + 'px';
    const count = Math.min(85, Math.max(30, Math.floor(innerWidth * innerHeight / 18000)));
    ps = Array.from({length: count}, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - .5) * .34 * DPR,
      vy: (Math.random() - .5) * .34 * DPR,
      r: (Math.random() * 1.5 + .6) * DPR
    }));
  }

  const MAX = () => 150 * DPR;

  function loop(){
    ctx.clearRect(0, 0, W, H);
    const max = MAX(), max2 = max * max;
    for (let i = 0; i < ps.length; i++){
      const p = ps[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      for (let j = i + 1; j < ps.length; j++){
        const q = ps[j];
        const dx = p.x - q.x, dy = p.y - q.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < max2){
          const a = (1 - Math.sqrt(d2) / max) * .26;
          ctx.strokeStyle = 'rgba(34,211,238,' + a + ')';
          ctx.lineWidth = DPR * .6;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.stroke();
        }
      }
    }
    for (const p of ps){
      ctx.beginPath();
      ctx.fillStyle = 'rgba(130,225,255,.55)';
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(loop);
  }

  init(); loop();
  let rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(init, 180); });
})();

/* =========================================================
   2. 资源数据
   ========================================================= */
const ICONS = [
  '<path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/>',
  '<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  '<circle cx="12" cy="12" r="9"/><path d="M10 8.5 16 12l-6 3.5z"/>',
  '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/>',
  '<path d="M7 18a4 4 0 0 1 0-8 5.5 5.5 0 0 1 10.6 1.5A3.5 3.5 0 0 1 17 18z"/>',
  '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/>'
];
const ICON_COLORS = ['#22d3ee', '#a855f7', '#38bdf8', '#f472b6', '#34d399', '#fbbf24'];

const RESOURCES = [
  { name:'PUBG国际服',
    desc:'10年老店',
    tags:['Windows','GPU 加速','免安装'] },
  { name:'米麒麟数据恢复大师', ver:'v5.0.4', size:'92 MB',
    desc:'深度扫描磁盘扇区，支持误删、格式化、分区丢失等多种恢复场景。',
    tags:['Windows','数据安全'] },
  { name:'全平台视频嗅探器', ver:'v2.8.0', size:'64 MB',
    desc:'一键解析主流平台视频直链，支持 8K 下载与字幕自动提取。',
    tags:['Win/Mac','批量下载'] },
  { name:'系统优化引擎 Turbo', ver:'v1.9.7', size:'120 MB',
    desc:'内存智能释放、启动项管理、驱动一键更新，让老机器重获新生。',
    tags:['Windows','性能提升'] },
  { name:'私有云盘部署套件', ver:'v4.1.2', size:'340 MB',
    desc:'Docker 一键部署的私有云方案，支持多端同步、在线预览与权限管理。',
    tags:['Linux','Docker','NAS'] },
  { name:'智能字幕生成器', ver:'v2.3.5', size:'210 MB',
    desc:'语音识别自动打轴，支持 32 种语言互译与 SRT / ASS 格式导出。',
    tags:['全平台','AI 翻译'] }
];

/* =========================================================
   3. 渲染资源卡片
   ========================================================= */
const grid = document.getElementById('grid');
grid.innerHTML = RESOURCES.map((r, i) => `
  <article class="card" style="animation-delay:${i * 70}ms">
    <div class="card-head">
      <div class="icon" style="color:${ICON_COLORS[i % ICON_COLORS.length]}">
        <svg viewBox="0 0 24 24">${ICONS[i % ICONS.length]}</svg>
      </div>
      <div>
        <h3>${r.name}</h3>
        <div class="ver">${r.ver} · ${r.size}</div>
      </div>
    </div>
    <p class="desc">${r.desc}</p>
    <div class="tags">${r.tags.map(t => `<span>${t}</span>`).join('')}</div>
    <button class="dl-btn" data-idx="${i}">↓ 立即下载</button>
  </article>
`).join('');
document.getElementById('statFiles').textContent = RESOURCES.length;

/* =========================================================
   4. 下载逻辑（生成占位文件，可替换为真实地址）
   ========================================================= */
function doDownload(r){
  // ⚠️ 演示：生成占位 txt。真实项目请替换为后端签名下载链接。
  const content =
`========================================
  米麒麟科技 · 资源下载凭据
========================================
资源名称：${r.name}
版本号　：${r.ver}
文件大小：${r.size}
生成时间：${new Date().toLocaleString('zh-CN')}
下载令牌：${Math.random().toString(36).slice(2, 10).toUpperCase()}

本文件为演示占位内容。
请在后端将下载地址替换为真实的资源 CDN 链接。
========================================`;

  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = r.name + '_' + r.ver + '.txt';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* =========================================================
   5. 点击下载（直接下载，无任何验证）
   ========================================================= */
grid.addEventListener('click', e => {
  const btn = e.target.closest('.dl-btn');
  if (!btn || btn.disabled) return;

  const r = RESOURCES[+btn.dataset.idx];
  const original = btn.textContent;

  // 按钮进入“下载中”状态
  btn.disabled = true;
  btn.textContent = '⏳ 正在下载...';

  doDownload(r);

  // 2 秒后恢复，可重复下载
  setTimeout(() => {
    btn.disabled = false;
    btn.textContent = original;
  }, 2000);

  toast('↓ 下载已开始：' + r.name);
});

/* =========================================================
   6. 顶部按钮 → 滚动到资源区
   ========================================================= */
document.getElementById('jumpBtn').onclick = () => {
  document.getElementById('grid').scrollIntoView({ behavior:'smooth', block:'start' });
};

/* =========================================================
   7. Toast
   ========================================================= */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
</body>
</html>
